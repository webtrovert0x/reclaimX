[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
solc_version = "0.8.20"
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
bot_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"
